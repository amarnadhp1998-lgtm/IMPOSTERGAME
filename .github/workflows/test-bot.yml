name: Temporary Telegram bot test

on:
  workflow_dispatch:

concurrency:
  group: imposter-telegram-bot-test
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Confirm token secret is configured
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Add BOT_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create runtime config from token-free template
        run: cp config.example.py config.py
      - name: Run bot
        run: python -u bot.py
